name: pages-placeholder

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-placeholder-router-homes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy noindex golden placeholder
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy/golden-placeholder --project-name=router-homes --branch=main --commit-dirty=true
