name: pages-content

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY after the domain is verified and content is approved'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-content-router-homes
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY' && vars.PAGES_CONTENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Deploy full content
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/router-homes/dist --project-name=router-homes --branch=main --commit-dirty=true
